<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pocket Banana: die Mini-Kapsel für deinen Gurt mit Intimtüchern. Selbst gestalten, Tücher im Abo.">
<meta name="theme-color" content="#FFD60A">
<title>Pocket Banana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticker-collage shop. Loud yellow ground, ink outlines, chunky offset shadows, one pink highlight. Deliberately single (light) look. */
:root{
  color-scheme: light;
  --yellow:#FFD60A;
  --ink:#1A1033;
  --pink:#FF6FB5;
  --cream:#FFF8E7;
  --sky:#7CC8FF;
  --green:#8FD16A;
  --red:#C2183A;
  --ink-soft:#3D2F5C;
  --display:"Bagel Fat One", "Arial Black", Impact, system-ui, sans-serif;
  --body:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:22px;
  --shadow:6px 6px 0 var(--ink);
  --wrap:1180px;
}
*{box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--yellow);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:.95;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.wrap{max-width:var(--wrap);margin-inline:auto}
.mono{font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px;background:var(--yellow);border-bottom:3px solid var(--ink)}
.nav .wrap{display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.5rem;text-decoration:none}
.logo svg{width:38px;height:38px}
.nav-links{display:flex;gap:18px;margin-left:auto;font-weight:600}
.nav-links a{text-decoration:none}
.nav-links a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--yellow);border:0;border-radius:999px;padding:8px 16px;font-weight:800}
.cart-count{background:var(--pink);color:var(--ink);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
@media (max-width:720px){.nav-links{display:none}.cart-btn{margin-left:auto}}

/* ticker */
.ticker{margin-inline:-16px;background:var(--ink);color:var(--yellow);overflow:hidden;white-space:nowrap;border-bottom:3px solid var(--ink)}
.ticker-track{display:inline-flex;gap:28px;padding:10px 0;animation:slide 28s linear infinite;font-family:var(--display);font-size:1.15rem}
.ticker-track span:nth-child(even){color:var(--pink)}
@keyframes slide{to{transform:translateX(-50%)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:999px;padding:14px 26px;font-weight:800;font-size:1.05rem;text-decoration:none;background:var(--cream);box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn.primary{background:var(--pink)}
.btn.dark{background:var(--ink);color:var(--yellow)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding-block:56px 40px}
.hero h1{font-size:clamp(3.2rem,9vw,7.4rem)}
.hl{display:inline-block;background:var(--pink);padding:0 .18em;border:4px solid var(--ink);border-radius:18px;transform:rotate(-3deg);box-shadow:var(--shadow);margin-block:.08em}
.hero-copy{display:flex;flex-direction:column;gap:24px;min-width:0}
.hero-copy p{font-size:1.25rem;max-width:34ch}
.cta-row{display:flex;flex-wrap:wrap;gap:14px}
.hero-art{position:relative;aspect-ratio:1/1.05;max-width:100%;background:var(--sky);border:4px solid var(--ink);border-radius:40px;box-shadow:10px 10px 0 var(--ink);display:grid;place-items:center;overflow:hidden}
.hero-art svg{width:78%;height:auto;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
.sticker{position:absolute;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9rem;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;z-index:2}
.s1{top:7%;left:6%;transform:rotate(-8deg)}
.s2{top:17%;right:5%;transform:rotate(7deg);background:var(--yellow)}
.s3{bottom:7%;left:9%;transform:rotate(4deg);background:var(--pink)}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-block:36px 24px}}

/* sections */
section{padding-block:56px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:32px}
.sec-head h2{font-size:clamp(2.4rem,6vw,4.4rem)}
.sec-head p{max-width:40ch;font-size:1.1rem}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:var(--cream);border:3px solid var(--ink);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px}
.step-n{font-family:var(--display);font-size:3.2rem;line-height:1;color:var(--pink);-webkit-text-stroke:2px var(--ink)}
.step h3{font-size:1.8rem}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* builder */
.builder{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.stage{position:sticky;top:90px;background:var(--ink);border-radius:36px;padding:28px;display:grid;place-items:center;aspect-ratio:1/1.08;max-width:100%;border:4px solid var(--ink);box-shadow:10px 10px 0 var(--pink)}
.stage svg{width:72%;height:auto}
.stage .mono{position:absolute;top:18px;left:22px;color:var(--yellow)}
.stage{position:sticky}
.controls{display:flex;flex-direction:column;gap:22px;background:var(--cream);border:3px solid var(--ink);border-radius:30px;padding:26px;min-width:0}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl-label{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.ctrl-label .mono{font-weight:500;color:var(--ink-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--ink);transform:scale(1.05)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.chip small{font-family:var(--mono);opacity:.75}
.txt{border:3px solid var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-weight:600;background:#fff;color:var(--ink);width:100%}
.sum{border-top:3px dashed var(--ink);padding-top:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.price{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:.9rem;font-weight:600;display:block;line-height:1.2}
@media (max-width:860px){.builder{grid-template-columns:1fr}.stage{position:relative;top:0}}

/* facts label */
.facts-row{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:start}
.label{background:#fff;border:4px solid var(--ink);padding:18px 20px;max-width:420px;font-family:var(--body)}
.label h3{font-family:var(--body);font-weight:800;font-size:2.2rem;letter-spacing:-.02em;border-bottom:10px solid var(--ink);padding-bottom:6px}
.label .serv{border-bottom:5px solid var(--ink);padding-block:6px;font-weight:600}
.label dl{margin:0}
.label .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1.5px solid var(--ink);padding-block:7px}
.label dt{font-weight:800}
.label dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.label .foot{font-size:.8rem;padding-top:8px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pill-card{background:var(--cream);border:3px solid var(--ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.pill-card b{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.05}
.pill-card:nth-child(2){background:var(--pink)}
.pill-card:nth-child(3){background:var(--sky)}
@media (max-width:860px){.facts-row{grid-template-columns:1fr}}
@media (max-width:480px){.pills{grid-template-columns:1fr}}

/* abo */
.toggle{display:inline-flex;border:3px solid var(--ink);border-radius:999px;padding:4px;background:var(--cream);gap:4px;flex-wrap:wrap}
.toggle button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:700}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;align-items:stretch}
.plan{position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:30px;padding:26px;display:flex;flex-direction:column;gap:14px}
.plan.hot{background:var(--ink);color:var(--cream);box-shadow:10px 10px 0 var(--pink);transform:rotate(-1deg)}
.plan .tag{position:absolute;top:-16px;right:20px;background:var(--pink);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem;transform:rotate(4deg)}
.plan h3{font-size:2rem}
.plan .amt{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.plan .amt span{font-family:var(--body);font-size:1rem;font-weight:600}
.plan ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.plan .btn{margin-top:auto}
.plan.hot .btn{background:var(--yellow);color:var(--ink);box-shadow:6px 6px 0 var(--pink)}
.oneoff{margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;border:3px dashed var(--ink);border-radius:var(--r);padding:18px 22px}
@media (max-width:900px){.plans{grid-template-columns:1fr}.plan.hot{transform:none}}

/* faq */
.faq{display:flex;flex-direction:column;gap:12px;max-width:820px}
details{background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:16px 20px}
summary{font-weight:800;font-size:1.15rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--display);font-size:1.5rem;line-height:1}
details[open] summary::after{content:"–"}
details p{padding-top:10px;max-width:65ch}

/* footer */
footer{margin-inline:-16px;padding:48px 16px 40px;background:var(--ink);color:var(--cream);margin-top:40px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:end}
footer .big{font-family:var(--display);font-size:clamp(2.6rem,10vw,7rem);color:var(--yellow);line-height:.9}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(26,16,51,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--cream);border-left:4px solid var(--ink);z-index:50;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));gap:16px;transform:translateX(105%);transition:transform .25s ease}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.drawer-head h2{font-size:2rem}
.x{border:3px solid var(--ink);background:var(--yellow);border-radius:50%;width:40px;height:40px;font-weight:800}
.items{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;background:#fff}
.item .meta{font-size:.85rem;color:var(--ink-soft);grid-column:1}
.item .p{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.item .rm{grid-column:2;border:0;background:none;text-decoration:underline;font-size:.85rem;justify-self:end;padding:0}
.empty{text-align:center;padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;border-top:3px solid var(--ink);padding-top:12px;font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--yellow);padding:12px 20px;border-radius:999px;font-weight:800;z-index:60;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .ticker-track,.hero-art svg{animation:none}
  .drawer,.toast,.btn{transition:none}
  html{scroll-behavior:auto}
}
/* demo video */
.demo{border:4px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--ink);box-shadow:10px 10px 0 var(--pink)}
.demo-screen{position:relative}
.demo-screen svg{display:block;width:100%;height:auto}
.demo-cap{position:absolute;left:14px;bottom:12px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 16px;font-weight:800;font-size:clamp(.8rem,2.2vw,1.2rem);max-width:calc(100% - 28px)}
.demo-cap:empty{display:none}
.demo-bar{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--ink);color:var(--cream)}
.demo-play{border:3px solid var(--cream);background:var(--pink);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:800;white-space:nowrap}
#demoSeek{flex:1;min-width:0;accent-color:var(--yellow)}
.demo-bar .mono{font-variant-numeric:tabular-nums;white-space:nowrap}

/* pissoir USP + demo */
.usp{display:grid;grid-template-columns:1fr 1fr;gap:24px 40px;align-items:end;background:var(--ink);color:var(--cream);border-radius:40px;padding:40px;margin-block:24px;box-shadow:10px 10px 0 var(--pink)}
.usp-head{display:flex;flex-direction:column;gap:14px;min-width:0}
.usp-head .mono{color:var(--yellow)}
.usp h2{font-size:clamp(2.8rem,7vw,5.2rem)}
.usp .hl{color:var(--ink)}
.usp-copy{display:flex;flex-direction:column;gap:16px;min-width:0}
.usp-copy p{font-size:1.15rem;max-width:42ch}
.usp-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.usp-list li{border:2px solid var(--yellow);color:var(--yellow);border-radius:999px;padding:6px 14px;font-weight:600}
.usp .demo{grid-column:1/-1;border-color:var(--cream);box-shadow:none;margin-top:8px}
.demo-big{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;background:var(--pink);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-size:2rem;padding-left:6px;transition:transform .12s}
.demo-big:hover{transform:translate(-50%,-50%) scale(1.08)}
@media (max-width:860px){.usp{grid-template-columns:1fr;padding:22px}.demo-big{width:64px;height:64px;font-size:1.5rem}}

/* account button + login modal */
.acc-btn{display:flex;align-items:center;gap:6px;border:2.5px solid var(--ink);background:var(--cream);border-radius:999px;padding:6px 14px;font-weight:800}
.acc-btn svg{width:18px;height:18px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(26,16,51,.55);display:grid;place-items:center;padding:16px}
.modal-card{position:relative;background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:10px 10px 0 var(--pink);padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.modal-card h2{font-size:2.4rem;padding-right:44px}
.modal-card .x{position:absolute;top:16px;right:16px}
.modal-card label{font-weight:800;margin-top:6px}
.modal-card .btn{margin-top:10px}
.err{color:var(--red);font-weight:700}

/* account page */
.acc{padding-block:40px}
.acc-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px}
.acc-top h1{font-size:clamp(3rem,9vw,6rem);margin-block:10px 8px}
.acc-top p{font-size:1.1rem}
.back{font-weight:700}
.acc-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card h3{font-size:1.8rem}
.card.wide{grid-column:1/-1}
.sub-card{background:var(--ink);color:var(--cream);box-shadow:8px 8px 0 var(--pink)}
.sub-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sub-card h3{font-size:2.4rem;color:var(--yellow)}
.kvs{display:flex;flex-wrap:wrap;gap:16px 32px}
.kv{display:flex;flex-direction:column;gap:6px}
.sub-card .mono{color:var(--yellow)}
.kv b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.status{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem;border:2px solid var(--ink);color:var(--ink);white-space:nowrap}
.status.ok{background:var(--green)}.status.transit{background:var(--sky)}.status.proc{background:var(--yellow)}.status.pause{background:var(--cream)}.status.off{background:var(--pink)}
.sub-actions{display:flex;flex-wrap:wrap;gap:12px}
.btn.sm{padding:9px 16px;font-size:.92rem;box-shadow:4px 4px 0 var(--ink)}
.sub-card .btn.sm{box-shadow:4px 4px 0 var(--pink);border-color:var(--cream)}
.sub-card .btn.ghost{background:transparent;color:var(--cream)}
.sub-card .toggle{border-radius:20px;align-self:flex-start}
.confirm{border:2px dashed var(--yellow);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.meter{height:20px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.meter span{display:block;height:100%;background:var(--pink)}
.big-num{font-family:var(--display);font-size:3.2rem;line-height:1}
.big-num small{font-size:1.4rem}
.hits{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:3px dashed var(--ink);padding-top:14px}
.hits b{font-family:var(--display);font-weight:400;font-size:2.2rem}
.table-wrap{overflow-x:auto}
.orders{width:100%;border-collapse:collapse;min-width:620px}
.orders th{text-align:left;font-family:var(--mono);font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:3px solid var(--ink)}
.orders td{padding:14px 10px;border-bottom:1.5px solid var(--ink);vertical-align:top}
.orders tr:last-child td{border-bottom:0}
.orders .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.orders td.mono{white-space:nowrap}
.cell-items{display:flex;flex-direction:column;gap:8px}
.bananas{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.banana-item{border:3px solid var(--ink);border-radius:20px;background:var(--sky);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.banana-item svg{width:110px;height:auto}
.banana-item .note{color:var(--ink)}
@media (max-width:860px){.acc-grid{grid-template-columns:1fr}}
@media (max-width:720px){.acc-btn .lbl{display:none}.acc-btn{padding:6px 9px}}
.logo{white-space:nowrap}
@media (max-width:480px){.nav .wrap{gap:10px}.logo{font-size:1.15rem;gap:6px}.logo svg{width:30px;height:30px}.lang button{padding:4px 8px}.cart-btn{padding:8px 12px}}

/* language switch */
.lang{display:inline-flex;border:2.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px;background:var(--cream)}
.lang button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-family:var(--mono);font-weight:500;font-size:.8rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
@media (max-width:720px){.lang{margin-left:auto}.cart-btn{margin-left:0}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">

const PATTERNS = {none:'Clean',dots:'Dots',stripes:'Stripes',checker:'Checker',flames:'Flames'};
const BASE = 24.90, ENGRAVE = 5;
const INK = '#1A1033';

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chf(n){return 'CHF ' + n.toFixed(2);}

function pouchSVG(cfg, id){
  const shell = COLORS[cfg.shell].hex, lid = COLORS[cfg.lid].hex;
  const dark = cfg.shell === 'midnight';
  const pc = dark ? '#FFF8E7' : INK;
  const pats = {
    dots:`<pattern id="${id}-p" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="3.5" fill="${pc}"/></pattern>`,
    stripes:`<pattern id="${id}-p" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="22" fill="${pc}"/></pattern>`,
    checker:`<pattern id="${id}-p" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="15" height="15" fill="${pc}"/><rect x="15" y="15" width="15" height="15" fill="${pc}"/></pattern>`,
    flames:`<pattern id="${id}-p" width="46" height="60" patternUnits="userSpaceOnUse"><path d="M23 58c-12 0-17-9-13-19 2 6 6 8 8 6-4-10 2-20 9-26-1 9 5 12 7 19 2-3 2-6 1-9 6 6 8 13 5 20-3 6-9 9-17 9z" fill="${pc}"/></pattern>`
  };
  const pat = cfg.pattern !== 'none' ? pats[cfg.pattern] : '';
  const overlay = pat ? `<rect x="80" y="100" width="140" height="220" rx="62" fill="url(#${id}-p)" opacity="${dark?0.35:0.22}"/>` : '';
  const text = (cfg.engrave||'').trim();
  const fs = text.length > 9 ? 17 : text.length > 6 ? 21 : 26;
  return `<svg viewBox="0 0 300 360" role="img" aria-label="${esc(t('preview')(COLORS[cfg.shell].name, COLORS[cfg.lid].name))}">
    <defs>${pat}</defs>
    <rect x="-10" y="160" width="320" height="56" fill="${INK}"/>
    <line x1="-10" y1="170" x2="310" y2="170" stroke="#FFF8E7" stroke-width="2" stroke-dasharray="7 6" opacity=".5"/>
    <line x1="-10" y1="206" x2="310" y2="206" stroke="#FFF8E7" stroke-width="2" stroke-dasharray="7 6" opacity=".5"/>
    <path d="M132 76 C 118 44, 150 30, 140 6 C 166 22, 190 30, 170 76 Z" fill="#FFFFFF" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
    <path d="M146 64 C 150 46, 160 38, 158 24" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round" opacity=".35"/>
    <rect x="80" y="100" width="140" height="220" rx="62" fill="${shell}" stroke="${INK}" stroke-width="5"/>
    ${overlay}
    <rect x="80" y="100" width="140" height="220" rx="62" fill="none" stroke="${INK}" stroke-width="5"/>
    <path d="M102 140 C 100 190, 100 240, 112 286" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".45"/>
    <rect x="76" y="70" width="148" height="56" rx="26" fill="${lid}" stroke="${INK}" stroke-width="5"/>
    <rect x="124" y="70" width="52" height="10" rx="5" fill="${INK}"/>
    ${text ? `<text x="150" y="222" text-anchor="middle" font-family="Bagel Fat One, Arial Black, sans-serif" font-size="${fs}" fill="${dark ? '#FFF8E7' : INK}">${esc(text)}</text>` : ''}
    <g transform="translate(150 274)"><circle r="22" fill="${INK}"/><path d="M-12-5c3 13 17 16 23 3-5 6-15 5-19-4z" fill="#FFD60A" stroke="#FFD60A" stroke-width="2" stroke-linejoin="round"/></g>
  </svg>`;
}

/* builder */
const cfg = {shell:'banana',lid:'midnight',pattern:'none',engrave:''};
function swatchGroup(el, key){
  el.innerHTML = Object.entries(COLORS).map(([k,v])=>`<button type="button" class="sw" data-k="${k}" style="background:${v.hex}" aria-label="${v.name}" aria-pressed="${cfg[key]===k}"></button>`).join('');
  el.addEventListener('click',e=>{const b=e.target.closest('.sw'); if(!b) return; cfg[key]=b.dataset.k; renderBuild();});
}
swatchGroup(document.getElementById('shellSw'),'shell');
swatchGroup(document.getElementById('lidSw'),'lid');
const patEl = document.getElementById('patChips');
patEl.innerHTML = Object.entries(PATTERNS).map(([k,v])=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${cfg.pattern===k}">${v}</button>`).join('');
patEl.addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b) return; cfg.pattern=b.dataset.k; renderBuild();});
const engrave = document.getElementById('engrave');
engrave.addEventListener('input',()=>{cfg.engrave = engrave.value.toUpperCase(); renderBuild();});

function buildPrice(){return BASE + (cfg.engrave.trim()?ENGRAVE:0);}
function renderBuild(){
  document.getElementById('buildPouch').innerHTML = pouchSVG(cfg,'b');
  document.querySelectorAll('#shellSw .sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cfg.shell));
  document.querySelectorAll('#lidSw .sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cfg.lid));
  document.querySelectorAll('#patChips .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cfg.pattern));
  document.getElementById('shellName').textContent = COLORS[cfg.shell].name;
  document.getElementById('lidName').textContent = COLORS[cfg.lid].name;
  document.getElementById('stageName').textContent = cfg.engrave.trim() ? `“${cfg.engrave.trim()}”` : t('stageDefault');
  document.getElementById('buildPrice').innerHTML = `${chf(buildPrice())}<small>${t('priceSub')}</small>`;
}

let cart = [];
try{ cart = (JSON.parse(localStorage.getItem('pb-cart2')||'[]') || []).filter(i=>i && i.kind); }catch(e){ cart = []; }
function save(){ try{ localStorage.setItem('pb-cart2',JSON.stringify(cart)); }catch(e){} }
function label(it){
  if(it.kind==='sub'){ const p=PLANS.find(x=>x.id===it.plan); return {name:t('subName')(p.name), meta:t('subMeta')(it.n,it.weeks)}; }
  if(it.kind==='refill') return {name:t('refillName'), meta:t('refillMeta')};
  const parts=[COLORS[it.shell].name, `${COLORS[it.lid].name}-${t('lidWord')}`, PATTERNS[it.pattern]];
  if(it.engrave) parts.push(`${t('engWord')} “${it.engrave}”`);
  return {name:'Pocket Banana', meta:parts.join(' · ')};
}
function addItem(it){ cart.push(it); save(); renderCart(); toast(t('added')(label(it).name)); }
function renderCart(){
  document.getElementById('cartCount').textContent = cart.length;
  const box = document.getElementById('items');
  if(!cart.length){
    box.innerHTML = `<div class="empty"><b style="font-family:var(--display);font-size:1.6rem;font-weight:400">${t('emptyT')}</b><p>${t('emptyP')}</p></div>`;
  } else {
    box.innerHTML = cart.map((it,i)=>{const l=label(it); return `<div class="item"><b>${esc(l.name)}</b><span class="p">${chf(it.price)}</span><span class="meta">${esc(l.meta)}</span><button class="rm" type="button" data-i="${i}">${t('remove')}</button></div>`;}).join('');
  }
  const sum = cart.reduce((a,b)=>a+b.price,0);
  document.getElementById('total').textContent = chf(sum);
  document.getElementById('shipNote').textContent = sum>=30 ? t('shipFree') : sum>0 ? t('shipLeft')(chf(30-sum)) : t('shipInfo');
}
document.getElementById('items').addEventListener('click',e=>{
  const b=e.target.closest('.rm'); if(!b) return; cart.splice(+b.dataset.i,1); save(); renderCart();
});

document.getElementById('builderForm').addEventListener('submit',e=>{
  e.preventDefault();
  addItem({kind:'pouch',shell:cfg.shell,lid:cfg.lid,pattern:cfg.pattern,engrave:cfg.engrave.trim(),price:buildPrice()});
});

const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function openCart(){drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');scrim.hidden=false;document.getElementById('cartClose').focus();}
function closeCart(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');scrim.hidden=true;}
document.getElementById('cartOpen').addEventListener('click',openCart);
document.getElementById('cartClose').addEventListener('click',closeCart);
scrim.addEventListener('click',closeCart);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCart();});
let pendingCheckout = false;
document.getElementById('checkout').addEventListener('click',()=>{
  if(!cart.length) return toast(t('coEmpty'));

});

let tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200);}

/* demo video */
const DUR = 14, $ = id => document.getElementById(id);
const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
const seg = (x,a,b) => clamp((x-a)/(b-a));
const ease = p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
const lerp = (a,b,p) => a+(b-a)*p;
const L2 = (A,B,p) => [lerp(A[0],B[0],p), lerp(A[1],B[1],p)];
const POSE = {REST:[34,-92],CAP:[41,-100],UP:[58,-150],WIPE:[30,-80],HOLD:[52,-122],AIM:[-14,-190],REL:[42,-182]};
const TGT = [525,214], REL_W = [190+POSE.REL[0], 320+POSE.REL[1]];
const fly = p => [lerp(REL_W[0],TGT[0],p), lerp(REL_W[1],TGT[1],p) - 150*4*p*(1-p)];
$('dArc').setAttribute('d', Array.from({length:21},(_,i)=>fly(i/20)).map((q,i)=>`${i?'L':'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' '));
const CONF = Array.from({length:22},(_,i)=>{
  const a = -Math.PI/2 + (Math.random()-.5)*2.2, v = 160+Math.random()*180;
  const el = document.createElementNS('http://www.w3.org/2000/svg','rect');
  el.setAttribute('width',8); el.setAttribute('height',5);
  el.setAttribute('fill',['#FF6FB5','#FFD60A','#FFF8E7','#7CC8FF'][i%4]);
  el.setAttribute('stroke','#1A1033'); el.setAttribute('stroke-width',1);
  $('dConfetti').appendChild(el);
  return {el, vx:Math.cos(a)*v, vy:Math.sin(a)*v, spin:(Math.random()-.5)*900};
});
const guyX = x => x<3.2 ? lerp(-60,420,x/3.2) : x<6.8 ? 420 : x<7.9 ? lerp(420,190,ease(seg(x,6.8,7.9))) : 190;
function hand(x){
  if(x<3.4) return POSE.REST;
  if(x<3.9) return L2(POSE.REST,POSE.CAP,ease(seg(x,3.4,3.9)));
  if(x<4.5) return L2(POSE.CAP,POSE.UP,ease(seg(x,3.9,4.5)));
  if(x<4.8) return POSE.UP;
  if(x<5.0) return L2(POSE.UP,POSE.WIPE,ease(seg(x,4.8,5.0)));
  if(x<6.6) return [POSE.WIPE[0]+Math.sin(x*38)*7, POSE.WIPE[1]+Math.cos(x*29)*3];
  if(x<6.9) return L2(POSE.WIPE,POSE.HOLD,ease(seg(x,6.6,6.9)));
  if(x<7.9) return POSE.HOLD;
  if(x<8.8) return L2(POSE.HOLD,POSE.AIM,ease(seg(x,7.9,8.8)));
  if(x<9.0) return L2(POSE.AIM,POSE.REL,seg(x,8.8,9.0));
  if(x<10.3) return POSE.REL;
  return [24,-206];
}
const show = (id,on) => $(id).setAttribute('opacity', typeof on==='number' ? on : on?1:0);
function capIndex(x){ const b=[3.3,4.8,6.7,7.9,9.0,10.2,12.2]; for(let i=0;i<b.length;i++) if(x<b[i]) return i; return -1; }
function renderDemo(x){
  const walking = x<3.2 || (x>6.8 && x<7.9);
  const gx = guyX(x), ph = gx*0.07;
  const la = walking ? Math.sin(ph)*28 : 0;
  const bob = walking ? -Math.abs(Math.sin(ph))*4 : 0;
  const jmp = x>10.3 && x<11.4 ? -Math.abs(Math.sin((x-10.3)*Math.PI/0.55))*28 : 0;
  const gy = 320 + bob + jmp;
  $('dGuy').setAttribute('transform',`translate(${gx} ${gy})`);
  $('dLegB').setAttribute('transform',`translate(-10 -48) rotate(${-la})`);
  $('dLegF').setAttribute('transform',`translate(10 -48) rotate(${la})`);
  $('dArmB').setAttribute('x2',-12+la*0.6); $('dArmB').setAttribute('y2',-78);
  const [hx,hy] = hand(x);
  const arm = $('dArmF'); arm.setAttribute('x1',30); arm.setAttribute('y1',-124); arm.setAttribute('x2',hx); arm.setAttribute('y2',hy);
  $('dHand').setAttribute('cx',hx); $('dHand').setAttribute('cy',hy);
  $('dLid').setAttribute('transform', x>=3.85 && x<4.7 ? 'rotate(-110 15 0)' : '');
  show('dCensor', seg(x,4.8,5.0)*(1-seg(x,6.55,6.75)));
  const gl = seg(x,8.2,8.7); $('dGlint').setAttribute('opacity', Math.sin(gl*Math.PI));
  const hw = [gx+hx, gy+hy];
  // tissue sheet, then crumpled ball
  if((x>=3.9 && x<4.95) || (x>=6.6 && x<6.7)){ show('dSheet',1); $('dSheet').setAttribute('transform',`translate(${hw[0]} ${hw[1]}) scale(${x<6.6?1:1-seg(x,6.6,6.7)})`); } else show('dSheet',0);
  if(x>=6.6 && x<10.45){
    let bp = hw, sc = seg(x,6.6,6.75), rot = 0;
    if(x>=9.0){ const p = seg(x,9.0,10.2); bp = fly(p); rot = p*900; }
    if(x>=10.2) sc = 1-seg(x,10.2,10.45);
    show('dBall',1); $('dBall').setAttribute('transform',`translate(${bp[0]} ${bp[1]}) rotate(${rot}) scale(${sc})`);
  } else show('dBall',0);
  show('dArc', seg(x,8.0,8.6)*(1-seg(x,9.6,10.2))*0.8);
  show('dSlow', x>=9.0 && x<10.2 ? (Math.floor(x*4)%2 ? 1 : .55) : 0);
  // fx texts
  const pp = seg(x,3.9,4.5);
  $('dPlopp').setAttribute('transform',`translate(${gx+40} ${gy-150-pp*24})`); show('dPlopp', x>=3.9 && x<4.5 ? 1-pp*0.6 : 0);
  $('dWisch').setAttribute('transform',`translate(${gx-170} ${gy-190+Math.sin(x*9)*4}) rotate(${Math.sin(x*6)*6})`); show('dWisch', x>=5.0 && x<6.6);
  const sw = seg(x,10.2,10.45);
  $('dSwish').setAttribute('transform',`translate(${TGT[0]-60} 110) rotate(-8) scale(${sw<1 ? 0.3+sw*0.95 : 1.15-0.15*seg(x,10.45,10.6)})`);
  show('dSwish', x>=10.2 ? 1-seg(x,11.6,12.0) : 0);
  $('dPlus').setAttribute('transform',`translate(${TGT[0]+30} ${170-40*seg(x,10.3,11.5)})`);
  show('dPlus', x>=10.3 ? 1-seg(x,11.0,11.5) : 0);
  const tc = x-10.2;
  CONF.forEach(c=>{
    if(tc<0 || tc>1.4){ c.el.setAttribute('opacity',0); return; }
    const cx = TGT[0]+c.vx*tc, cy = TGT[1]-20+c.vy*tc+260*tc*tc;
    c.el.setAttribute('opacity',1-tc/1.4);
    c.el.setAttribute('transform',`translate(${cx} ${cy}) rotate(${c.spin*tc})`);
  });
  show('dEnd', seg(x,12.2,12.8));
  const ci = capIndex(x);
  $('demoCap').textContent = ci<0 ? '' : t('caps')[ci];
  $('demoSeek').value = x;
  const s = Math.floor(x); $('demoTime').textContent = `0:${String(s).padStart(2,'0')} / 0:${DUR}`;
}
let dT = 9.5, dPlaying = false, dStarted = false, dLast = 0;
function demoBtn(){ $('demoBig').hidden = dPlaying; $('demoPlay').textContent = dPlaying ? t('pause') : (dT>=DUR ? t('replay') : t('play')); }
function dTick(ts){
  if(!dPlaying) return;
  dT = Math.min(DUR, dT + (ts-dLast)/1000); dLast = ts;
  if(dT>=DUR){ dPlaying = false; demoBtn(); }
  renderDemo(dT);
  if(dPlaying) requestAnimationFrame(dTick);
}
function demoToggle(){
  if(dPlaying){ dPlaying=false; demoBtn(); return; }
  if(!dStarted || dT>=DUR){ dT = 0; dStarted = true; }
  dPlaying = true; demoBtn();
  requestAnimationFrame(ts=>{ dLast = ts; dTick(ts); });
}
$('demoPlay').addEventListener('click',demoToggle);
$('demoBig').addEventListener('click',demoToggle);
$('demoSeek').addEventListener('input',e=>{ dStarted = true; dPlaying = false; dT = +e.target.value; renderDemo(dT); demoBtn(); });
function demoLang(){
  $('dCensorTxt').textContent = t('censor'); $('dPlopp').textContent = t('plopp');
  $('dWisch').textContent = t('wisch'); $('dEndLine').textContent = t('endLine');
  renderDemo(dT); demoBtn();
}

/* account (demo, stored only in this browser) */
let acc = null, confirming = false;
try{ acc = JSON.parse(localStorage.getItem('pb-acc')||'null'); }catch(e){ acc = null; }
function saveAcc(){ try{ acc ? localStorage.setItem('pb-acc',JSON.stringify(acc)) : localStorage.removeItem('pb-acc'); }catch(e){} }
const isoToday = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const addDays = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = iso => new Date(iso+'T12:00:00').toLocaleDateString(lang==='de'?'de-CH':'en-GB',{day:'numeric',month:'long',year:'numeric'});
function newAccount(email){
  const raw = (email.split('@')[0].split(/[._\-+0-9]+/).find(Boolean) || 'Banana');
  const name = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
  const sub = w => ({kind:'sub',plan:'daily',n:40,weeks:w,price:14.90});
  return {
    email, name, since:'2026-08-18',
    sub:{plan:'daily',weeks:4,status:'active',last:'2026-10-13',next:'2026-11-10'},
    orders:[
      {id:'PB-1042',date:'2026-10-13',status:'transit',track:'99.60.104271.00428917',items:[sub(4)]},
      {id:'PB-0987',date:'2026-09-15',status:'delivered',items:[sub(4)]},
      {id:'PB-0931',date:'2026-08-18',status:'delivered',items:[{kind:'pouch',shell:'bubblegum',lid:'banana',pattern:'dots',engrave:'FRESH AF',price:29.90},{kind:'refill',price:9.90}]}
    ]
  };
}
function updateAccBtn(){
  $('accLbl').textContent = acc ? acc.name : t('login');
  $('accBtn').setAttribute('aria-label', acc ? t('myAccount') : t('login'));
}
function renderSub(){
  const s = acc.sub, p = PLANS.find(x=>x.id===s.plan);
  const cls = {active:'ok',paused:'pause',cancelled:'off'}[s.status];
  let h = `<span class="mono">${t('yourSub')}</span>
    <div class="sub-head"><h3>${p.name}</h3><span class="status ${cls}">${t('st_'+s.status)}</span></div>
    <div class="kvs">
      <div class="kv"><span class="mono">${t('nextDel')}</span><b>${s.status==='active' ? fmtDate(s.next) : '–'}</b></div>
      <div class="kv"><span class="mono">${t('content')}</span><b>${t('wipesN')(p.n)}</b></div>
      <div class="kv"><span class="mono">${t('perDel')}</span><b>${chf(p.price)}</b></div>
    </div>`;
  if(s.status === 'cancelled'){
    h += `<p>${t('cancelledText')}</p><div class="sub-actions"><button class="btn sm primary" type="button" data-act="restart">${t('restart')}</button></div>`;
  } else {
    h += `<div class="kv"><span class="mono">${t('rhythm')}</span><div class="toggle" role="group" aria-label="${t('rhythm')}">${[2,4,8].map(w=>`<button type="button" data-w="${w}" aria-pressed="${s.weeks===w}">${t('every')(w)}</button>`).join('')}</div></div>`;
    if(confirming){
      h += `<div class="confirm"><p>${t('cancelQ')}</p><div class="sub-actions"><button class="btn sm primary" type="button" data-act="cancelYes">${t('cancelYes')}</button><button class="btn sm ghost" type="button" data-act="cancelNo">${t('cancelNo')}</button></div></div>`;
    } else {
      h += `<div class="sub-actions">${s.status==='active'
        ? `<button class="btn sm" type="button" data-act="skip">${t('skip')}</button><button class="btn sm" type="button" data-act="pause">${t('pause')}</button>`
        : `<button class="btn sm primary" type="button" data-act="resume">${t('resume')}</button>`}
        <button class="btn sm ghost" type="button" data-act="cancel">${t('cancel')}</button></div>`;
    }
  }
  $('subCard').innerHTML = h;
}
$('subCard').addEventListener('click',e=>{
  const s = acc && acc.sub; if(!s) return;
  const wb = e.target.closest('[data-w]'), ab = e.target.closest('[data-act]');
  if(wb){ s.weeks = +wb.dataset.w; s.next = addDays(s.last, s.weeks*7); toast(t('rhythmSet')(s.weeks)); }
  else if(ab){
    const a = ab.dataset.act;
    if(a==='skip'){ s.next = addDays(s.next, s.weeks*7); toast(t('skipped')(fmtDate(s.next))); }
    if(a==='pause'){ s.status = 'paused'; toast(t('paused')); }
    if(a==='resume' || a==='restart'){ s.status = 'active'; s.next = addDays(isoToday(), 3); toast(t('resumed')(fmtDate(s.next))); }
    if(a==='cancel'){ confirming = true; }
    if(a==='cancelNo'){ confirming = false; }
    if(a==='cancelYes'){ confirming = false; s.status = 'cancelled'; toast(t('cancelledMsg')); }
  } else return;
  saveAcc(); renderSub();
});
function renderOrders(){
  const rows = acc.orders.map(o=>{
    const total = o.items.reduce((a,b)=>a+b.price,0);
    const items = o.items.map(it=>{ const l=label(it); return `<div><b>${esc(l.name)}</b><br><span class="note">${esc(l.meta)}</span></div>`; }).join('');
    const cls = {transit:'transit',delivered:'ok',processing:'proc'}[o.status];
    return `<tr><td class="mono">${o.id}</td><td>${fmtDate(o.date)}</td><td><div class="cell-items">${items}${o.track?`<span class="note">${t('tracking')}: ${o.track}</span>`:''}</div></td><td><span class="status ${cls}">${t('st_'+o.status)}</span></td><td class="num">${chf(total)}</td></tr>`;
  }).join('');
  $('ordersTable').innerHTML = `<thead><tr><th>${t('thOrder')}</th><th>${t('thDate')}</th><th>${t('thItems')}</th><th>${t('thStatus')}</th><th style="text-align:right">${t('thTotal')}</th></tr></thead><tbody>${rows}</tbody>`;
}
function myBananas(){ return acc.orders.flatMap(o=>o.items).filter(i=>i.kind==='pouch'); }
function renderBananas(){
  const list = myBananas();
  $('bananas').innerHTML = list.length ? list.map((b,i)=>`<div class="banana-item">${pouchSVG(b,'acc'+i)}<span class="note">${esc(label(b).meta)}</span><button class="btn sm" type="button" data-re="${i}">${t('reorder')}</button></div>`).join('')
    : `<div class="banana-item"><p>${t('noBananas')}</p><a class="btn sm" href="#build">${t('designNow')}</a></div>`;
}
$('bananas').addEventListener('click',e=>{
  const b = e.target.closest('[data-re]'); if(!b) return;
  addItem({...myBananas()[+b.dataset.re]});
});
function renderAccount(){
  if(!acc) return;
  $('accHi').textContent = t('accHi')(acc.name);
  $('accEmail').textContent = acc.email;
  $('accSince').textContent = t('since')(fmtDate(acc.since));
  $('accAddr').innerHTML = `${esc(acc.name)} Muster<br>Bahnhofstrasse 1<br>8001 Zürich<br>${t('country')}`;
  renderSub(); renderOrders(); renderBananas();
}
function placeOrder(){
  const id = 'PB-' + (Math.max(...acc.orders.map(o=>+o.id.slice(3))) + 1);
  acc.orders.unshift({id, date:isoToday(), status:'processing', items:cart.slice()});
  const sub = cart.find(i=>i.kind==='sub');
  if(sub) acc.sub = {plan:sub.plan, weeks:sub.weeks, status:'active', last:isoToday(), next:addDays(isoToday(), sub.weeks*7)};
  cart = []; save(); renderCart(); saveAcc(); closeCart();
  toast(t('orderPlaced')(id)); goAccount();
}
function goAccount(){ if(location.hash==='#konto') route(); else location.hash = 'konto'; }
function route(){
  const h = location.hash.slice(1);
  if(h==='konto' && acc){ $('top').hidden = true; $('account').hidden = false; renderAccount(); window.scrollTo(0,0); return; }
  $('account').hidden = true; $('top').hidden = false;
  if(h==='konto'){ openLogin(); return; }
  const el = h && document.getElementById(h); if(el) el.scrollIntoView();
}
window.addEventListener('hashchange', route);
function openLogin(){ $('loginModal').hidden = false; $('loginErr').hidden = true; $('loginEmail').focus(); }
function closeLogin(){ $('loginModal').hidden = true; $('loginPw').value = ''; pendingCheckout = false; }
$('loginClose').addEventListener('click', closeLogin);
$('loginModal').addEventListener('click', e=>{ if(e.target.id==='loginModal') closeLogin(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('loginModal').hidden) closeLogin(); });
$('loginForm').addEventListener('submit', e=>{
  e.preventDefault();
  const email = $('loginEmail').value.trim(), pw = $('loginPw').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !pw){ $('loginErr').textContent = t('loginErr'); $('loginErr').hidden = false; return; }
  const checkout = pendingCheckout;
  acc = newAccount(email); saveAcc(); closeLogin(); updateAccBtn();
  toast(t('welcome')(acc.name));
  if(checkout && cart.length) placeOrder(); else goAccount();
});
$('accBtn').addEventListener('click', ()=> acc ? goAccount() : openLogin());
$('logoutBtn').addEventListener('click', ()=>{ acc = null; confirming = false; saveAcc(); updateAccBtn(); location.hash = 'top'; toast(t('loggedOut')); });

/* language */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML = t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===lang));
  engrave.placeholder = t('engPh');
  const words = t('ticker');
  document.getElementById('ticker').innerHTML = [...words,...words].map(w=>`<span>${w} ✦</span>`).join('');
  document.getElementById('heroPouch').innerHTML = pouchSVG({shell:'bubblegum',lid:'banana',pattern:'dots',engrave:'FRESH AF'},'hero');
  renderBuild(); renderPlans(); renderCart(); demoLang(); updateAccBtn(); renderAccount();
}
document.getElementById('lang').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  lang = b.dataset.l;
  try{ localStorage.setItem('pb-lang',lang); }catch(err){}
  applyLang();
});
applyLang();
route();
</script>
